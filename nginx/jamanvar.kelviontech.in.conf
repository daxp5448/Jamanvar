# ==============================================================================
# Nginx HTTPS Configuration for jamanvar.kelviontech.in
# Runs alongside KelvionTech in the shared Nginx proxy container
# (kelviontech-nginx-1), matching the same pattern as
# restaurant.kelviontech.in.conf / restaurent.kelviontech.in.conf.
#
# THIS IS THE FINAL FILE — it references a certificate that must already exist.
# Installing it before running certbot will fail `nginx -t`. The deploy runbook
# installs a temporary HTTP-only bootstrap version first, issues the
# certificate, then replaces it with this one. See DEPLOY_JAMANVAR.md.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. HTTP Server Block (301 Redirect to HTTPS)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name jamanvar.kelviontech.in;

    # Certbot ACME Challenge directory for SSL certificate renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. HTTPS Server Block (SSL & Reverse Proxy Rules)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name jamanvar.kelviontech.in;

    # SSL Certificates issued by Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/jamanvar.kelviontech.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jamanvar.kelviontech.in/privkey.pem;

    # SSL Security Optimization
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 10m;

    # Fingerprinted build assets — safe to cache forever.
    location /_next/static/ {
        proxy_pass http://172.17.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # Jamanvar Next.js Application Proxy (Host Port 3002)
    location / {
        proxy_pass http://172.17.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
