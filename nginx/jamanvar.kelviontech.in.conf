# ------------------------------------------------------------------------------
# Nginx virtual host — jamanvar.kelviontech.in
# For HOST nginx (/etc/nginx/sites-available/). Proxies to the Jamanvar
# container published on 127.0.0.1:3002.
#
# Install:
#   sudo cp nginx/jamanvar.kelviontech.in.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/jamanvar.kelviontech.in.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then run certbot, which rewrites this file to add the TLS server block:
#   sudo certbot --nginx -d jamanvar.kelviontech.in
# ------------------------------------------------------------------------------

upstream jamanvar_app {
    server 127.0.0.1:3002;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name jamanvar.kelviontech.in;

    access_log /var/log/nginx/jamanvar.access.log;
    error_log  /var/log/nginx/jamanvar.error.log;

    # Let's Encrypt HTTP-01 challenge (harmless if certbot uses --nginx instead)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    client_max_body_size 10m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss image/svg+xml font/woff font/woff2;

    # Fingerprinted build assets — safe to cache forever.
    location /_next/static/ {
        proxy_pass http://jamanvar_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # Brand video / images: long cache, but revalidatable.
    location ~* \.(?:mp4|webm|jpg|jpeg|png|gif|webp|avif|svg|ico|woff2?)$ {
        proxy_pass http://jamanvar_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
    }

    location / {
        proxy_pass http://jamanvar_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Empty Connection header keeps the upstream keepalive pool alive.
        # (The site is server-rendered HTML + static assets — no websockets.)
        proxy_set_header Connection "";

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
        proxy_buffering       on;
    }

    # Security headers (kept modest — no external CDNs are used by the site).
    add_header X-Content-Type-Options "nosniff"        always;
    add_header X-Frame-Options        "SAMEORIGIN"     always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy     "geolocation=(), microphone=(), camera=()" always;
}
