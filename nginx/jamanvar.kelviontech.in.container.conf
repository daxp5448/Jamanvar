# ------------------------------------------------------------------------------
# ALTERNATIVE vhost — use ONLY if nginx runs as a CONTAINER inside the
# KelvionTech stack (i.e. `docker ps` shows an nginx container owning 80/443).
#
# Drop this into the KelvionTech repo's nginx conf.d/ directory (the folder that
# is bind-mounted into the nginx container), then reload that nginx.
#
# It resolves the app by Docker DNS, so the Jamanvar container must be attached
# to the same Docker network:
#   docker compose -f docker-compose.yml -f docker-compose.shared-nginx.yml up -d --build
#
# Certificates: issue them from the KelvionTech stack's certbot container, e.g.
#   docker compose run --rm certbot certonly --webroot -w /var/www/certbot \
#       -d jamanvar.kelviontech.in
# then uncomment the TLS server block below and reload nginx.
# ------------------------------------------------------------------------------

server {
    listen 80;
    server_name jamanvar.kelviontech.in;

    # Docker's embedded DNS. The variable form means nginx starts fine even when
    # the Jamanvar container is down (502 instead of a boot failure).
    resolver 127.0.0.11 valid=30s ipv6=off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        set $jamanvar_upstream http://jamanvar-web:3000;
        proxy_pass $jamanvar_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }
}

